        "400":
          description: invalid_workspace_id
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "401":
          description: credential_invalid
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "403":
          description: forbidden, operator_only

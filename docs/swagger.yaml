securityDefinitions:
  BearerAuth:
    description: OPERATOR authentication. Type "Bearer" followed by a Keycloak-issued
      access token. The token must carry the realm `admin` role, which is re-checked
      against the provider on every request.
    in: header
    name: Authorization
    type: apiKey
  ProjectKeyAuth:
    description: PROJECT authentication (machine-to-machine). Type "Bearer" followed
      by a project credential, e.g. `Bearer lw_sk_<lookup>_<secret>`. The credential
      is bound to exactly one workspace and carries an explicit scope set; the scope
      each operation requires is stated in its description. Control-plane operations
      (workspaces, connections, projects) are operator-only and answer `operator_only`
      to any credential. Swagger 2.0 cannot express per-operation scopes for an apiKey
      scheme, so they are documented in prose rather than declared — see docs/PROJECTS.md.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

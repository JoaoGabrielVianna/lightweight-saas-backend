  /v1/workspaces/{workspace_id}/projects/{project_id}:
    get:
      description: |-
        A project belonging to a different workspace reads as not found,
        so an id cannot be used to confirm another workspace's contents.

        **Operator only.**
      parameters:
      - description: workspace id
        example: ws_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: workspace_id
        required: true
        type: string
      - description: project id
        example: prj_7c9e6679-7425-40de-944b-e07fc1f90ae7
        in: path
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.ProjectResponse'
        "400":
          description: invalid_workspace_id, invalid_project_id
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "401":
          description: credential_invalid
          schema:

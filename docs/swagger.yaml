        "400":
          description: invalid_workspace_id, invalid_request
          schema:
            $ref: '#/definitions/identityruntime.ErrorResponse'
        "401":
          description: credential_invalid
          schema:
            $ref: '#/definitions/identityruntime.ErrorResponse'
        "403":
          description: forbidden, operator_only, workspace_mismatch, insufficient_scope,
            role_privileged
          schema:
            $ref: '#/definitions/identityruntime.ErrorResponse'
        "404":
          description: workspace_not_found, role_not_found
          schema:
            $ref: '#/definitions/identityruntime.ErrorResponse'
        "409":
          description: workspace_archived, connection_read_only, conflict, provider_forbidden
          schema:
            $ref: '#/definitions/identityruntime.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/identityruntime.ErrorResponse'
        "502":
          description: provider_unavailable (includes SMTP not configured on the realm)
          schema:
            $ref: '#/definitions/identityruntime.ErrorResponse'
      security:
      - BearerAuth: []
      - ProjectKeyAuth: []
      summary: Invite a user to a workspace's realm
      tags:
      - workspace-identity
  /v1/workspaces/{workspace_id}/invitations/{invitation_id}:
    delete:
      description: |-
        An invitation IS a user, so this deletes the user. Self-deletion
        is refused; the last-admin guard does NOT apply here, because an
        invited user cannot yet hold admin. To delete a user who has
        accepted, use DELETE .../users/{user_id}, which is guarded.

        **Required scope (project credentials):** `invitations:write`.
        Operators are authorized by the realm `admin` role instead.

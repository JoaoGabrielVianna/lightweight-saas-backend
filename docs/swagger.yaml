  /v1/workspaces/{workspace_id}/connections/{connection_id}/verify:
    post:
      description: |-
        Probes the provider and records the verdict. The probe is
        strictly read-only: it reaches the provider, confirms the realm
        exists, authenticates the admin client, then reads the realm
        settings and lists one user. It creates no test user and
        modifies nothing.

        The first three checks decide `health`. The two admin reads
        decide `access_mode`: a service account that authenticates but
        cannot read is `healthy` + `limited` — correctly configured and
        under-privileged, which is a different fix from a wrong URL.

        A successful verification authorizes activation for one hour.
      parameters:
      - description: workspace id
        example: ws_5a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        in: path
        name: workspace_id
        required: true
        type: string
      - description: connection id
        example: conn_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: connection_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: the probe ran; check report.ok for the verdict
          schema:
            $ref: '#/definitions/connection.VerifyResponse'
        "400":
          description: invalid_workspace_id, invalid_connection_id
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: workspace_not_found, connection_not_found
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify a connection
      tags:
      - connections
  /v1/workspaces/{workspace_id}/invitations:
    get:
      description: |-
        Invitations are DERIVED from user state — Keycloak has no
        invitation resource. A user with pending required actions or
        invitation attributes appears here; once they complete those
        actions they stop appearing, without anything being deleted.

        `status` is computed: pending, accepted, expired or revoked.

        **Required scope (project credentials):** `invitations:read`.
        Operators are authorized by the realm `admin` role instead.
      parameters:
      - description: workspace id
        example: ws_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: workspace_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK

      tags:
      - projects
  /v1/workspaces:
    get:
      description: |-
        Returns workspaces ordered by name, then id. By default only
        active workspaces are returned — archived ones are operational
        history rather than part of the working set. Requires the
        caller's token to carry the realm `admin` role.
      parameters:
      - default: active
        description: which workspaces to return
        enum:
        - active
        - archived
        - all
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/workspace.ListWorkspacesResponse'
        "400":
          description: invalid_status_filter
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List workspaces
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      description: |-
        Creates an active workspace. `slug` is optional: when omitted
        it is derived from `name`. When supplied it is trimmed and
        lowercased but never rewritten — an unusable slug is reported
        rather than silently changed. Slugs are globally unique and are
        never released, including by archiving.
      parameters:
      - description: workspace to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/workspace.CreateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/workspace.WorkspaceResponse'
        "400":
          description: workspace_name_required, workspace_slug_invalid, workspace_slug_reserved,
            invalid_request
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: workspace_slug_taken
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a workspace
      tags:
      - workspaces
  /v1/workspaces/{workspace_id}:
    get:
      description: |-
        Returns one workspace by public id. Archived workspaces remain
        individually readable. Accepts `ws_<uuid>`; a bare UUID is also
        accepted as a development convenience.
      parameters:
      - description: workspace id
        example: ws_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: workspace_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/workspace.WorkspaceResponse'
        "400":
          description: invalid_workspace_id
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: workspace_not_found
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a workspace
      tags:
      - workspaces
    patch:
      consumes:
      - application/json
      description: |-
        Renames a workspace. `name` is the only mutable field: `slug`
        is immutable, and `status` changes go through the archive
        operation. Sending either is rejected rather than ignored, so a
        client never believes a change took effect when it did not.
        Archived workspaces cannot be modified.
      parameters:
      - description: workspace id
        example: ws_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: workspace_id
        required: true
        type: string
      - description: fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/workspace.UpdateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/workspace.WorkspaceResponse'
        "400":
          description: invalid_workspace_id, workspace_name_required, invalid_request
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: workspace_not_found
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
        "409":
          description: workspace_archived
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a workspace
      tags:
      - workspaces
  /v1/workspaces/{workspace_id}/archive:
    post:
      description: |-
        Moves a workspace to the archived state and stamps
        `archived_at`. Idempotent: archiving an already-archived
        workspace succeeds and returns it unchanged, so a retried
        request is safe. Nothing is deleted, the slug is not released,
        and there is no reactivation path.
      parameters:
      - description: workspace id
        example: ws_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: workspace_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/workspace.WorkspaceResponse'
        "400":
          description: invalid_workspace_id
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: workspace_not_found
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/workspace.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Archive a workspace
      tags:
      - workspaces
  /v1/workspaces/{workspace_id}/audit:
    get:
      description: |-
        Returns the durable audit trail for this workspace, newest first.

        **Required scope (project credentials):** `audit:read`.
        Operators are authorized by the realm `admin` role instead.

        The trail records ATTEMPTS TO CHANGE STATE by an identified actor —
        who did what, to which resource, whether it worked, and on which
        request. It is not a request log: reads are absent, and so is
        traffic that never got past authentication.

        **Pagination is cursor-based.** Pass the `next_cursor` from the
        previous page; its ABSENCE means there is no more history. Offset
        pagination is not offered: this table only ever grows at the head,
        so an offset shifts under a client between pages.

        **This endpoint never returns secret material.** No password, no
        credential secret or hash, no connection secret, no provider token,
        and no request body — regardless of who is asking.
      parameters:
      - description: workspace id
        example: ws_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: workspace_id
        type: string
      - description: exact event type, e.g. user.created
        in: query
        name: event
        type: string
      - description: operator or project
        enum:
        - operator
        - project
        in: query
        name: actor_type
        type: string
      - description: success or failure
        enum:
        - success
        - failure
        in: query
        name: outcome
        type: string
      - description: inclusive lower bound, RFC 3339
        example: "2026-08-01T00:00:00Z"
        in: query
        name: from
        type: string
      - description: inclusive upper bound, RFC 3339
        example: "2026-08-31T23:59:59Z"
        in: query
        name: to
        type: string
      - description: opaque cursor from the previous page
        in: query
        name: cursor
        type: string
      - description: page size, 1-200 (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auditlog.ListEventsResponse'
        "400":
          description: invalid_request, invalid_workspace_id
          schema:
            $ref: '#/definitions/auditlog.ErrorResponse'
        "401":
          description: credential_invalid
          schema:
            $ref: '#/definitions/auditlog.ErrorResponse'
        "403":
          description: forbidden, workspace_mismatch, insufficient_scope
          schema:
            $ref: '#/definitions/auditlog.ErrorResponse'
        "503":
          description: audit_unavailable
          schema:
            $ref: '#/definitions/auditlog.ErrorResponse'
      security:
      - BearerAuth: []
      - ProjectKeyAuth: []
      summary: List a workspace's audit history
      tags:
      - audit
  /v1/workspaces/{workspace_id}/connections:
    get:
      description: |-
        Returns the workspace's connections ordered by name, then id.
        Unlike the workspace listing, the default here is **all**
        statuses: the operator workflow is draft → verify → activate →
        the previous one retires, and hiding two thirds of that would
        make the endpoint unusable. Client secrets are never returned.
      parameters:
      - description: workspace id
        example: ws_5a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        in: path
        name: workspace_id
        required: true
        type: string
      - default: all
        description: which connections to return
        enum:
        - draft
        - active
        - retired
        - all
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connection.ListConnectionsResponse'
        "400":
          description: invalid_workspace_id, invalid_status_filter
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: workspace_not_found
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List a workspace's connections
      tags:
      - connections
    post:
      consumes:
      - application/json
      description: |-
        Creates a connection in **draft** state. The client secret is
        sealed with AES-256-GCM before it reaches the database and is
        never returned by any endpoint. A draft does nothing until it
        has been verified and activated.
      parameters:
      - description: workspace id
        example: ws_5a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        in: path
        name: workspace_id
        required: true
        type: string
      - description: connection to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/connection.CreateConnectionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/connection.ConnectionResponse'
        "400":
          description: connection_name_required, connection_base_url_invalid, connection_realm_required,
            connection_client_id_required, connection_client_secret_required, connection_provider_unsupported,
            invalid_workspace_id, invalid_request
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: workspace_not_found
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "409":
          description: workspace_archived
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a connection
      tags:
      - connections
  /v1/workspaces/{workspace_id}/connections/{connection_id}:
    delete:
      description: |-
        Permanently removes a **draft** or **retired** connection and
        its sealed credential. An active connection cannot be deleted:
        retire it first, so taking a workspace's provider out of
        service is a visible, separate step.
      parameters:
      - description: workspace id
        example: ws_5a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        in: path
        name: workspace_id
        required: true
        type: string
      - description: connection id
        example: conn_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: connection_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: deleted
        "400":
          description: invalid_workspace_id, invalid_connection_id
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: workspace_not_found, connection_not_found
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "409":
          description: connection_active_cannot_delete
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a connection
      tags:
      - connections
    get:
      description: Returns one connection. The client secret is never included.
      parameters:
      - description: workspace id
        example: ws_5a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        in: path
        name: workspace_id
        required: true
        type: string
      - description: connection id
        example: conn_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: connection_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connection.ConnectionResponse'
        "400":
          description: invalid_workspace_id, invalid_connection_id
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: workspace_not_found, connection_not_found
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a connection
      tags:
      - connections
    patch:
      consumes:
      - application/json
      description: |-
        Edits a **draft** connection's configuration. Changing
        `base_url`, `realm`, `client_id` or `client_secret` resets the
        verification — the stored verdict referred to coordinates that
        no longer apply, and keeping it would let the connection be
        activated on the strength of a probe against a different
        provider. `status` and `provider` are rejected rather than
        ignored: state changes go through activate and retire.
      parameters:
      - description: workspace id
        example: ws_5a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        in: path
        name: workspace_id
        required: true
        type: string
      - description: connection id
        example: conn_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: connection_id
        required: true
        type: string
      - description: fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/connection.UpdateConnectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connection.ConnectionResponse'
        "400":
          description: invalid_connection_id, connection_name_required, connection_base_url_invalid,
            invalid_request
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: workspace_not_found, connection_not_found
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "409":
          description: connection_not_draft, connection_retired
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/connection.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a draft connection
      tags:
      - connections
  /v1/workspaces/{workspace_id}/connections/{connection_id}/activate:
    post:
      description: |-
        Promotes a verified draft to **active** and retires the
        workspace's previous active connection in the same transaction.
        At most one connection per workspace is active, enforced by a
        partial unique index rather than by application code.

        Requires a verification that passed within the last hour.
        Unlike archive, this is deliberately **not** idempotent: a
        repeat call returns `connection_already_active`, because a
        caller retrying may believe they are switching away from a
        different connection.
      parameters:
      - description: workspace id
        example: ws_5a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        in: path
        name: workspace_id

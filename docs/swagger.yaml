          schema:
            $ref: '#/definitions/identityruntime.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/identityruntime.ErrorResponse'
        "502":
          description: provider_unavailable
          schema:
            $ref: '#/definitions/identityruntime.ErrorResponse'

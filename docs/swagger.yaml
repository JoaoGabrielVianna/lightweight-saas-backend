basePath: /
definitions:
  audit.Actor:
    properties:
      credential_id:
        type: string
      email:
        type: string
      project_id:
        description: |-
          Project fields. ProjectID and CredentialID are the public `prj_` and
          `key_` ids: the credential id is what an operator revokes, so an audit
          line names the exact key to pull rather than the project that held it.
        type: string
      subject:
        description: Operator fields.
        type: string
      type:
        allOf:
        - $ref: '#/definitions/audit.ActorType'
        description: |-
          Type is "operator" or "project". Empty only for an unattributed event
          (no principal on the request), which is preserved as a visible gap
          rather than defaulted to a plausible value.
      username:
        type: string
    type: object
  audit.ActorType:
    enum:
    - operator
    - project
    type: string
    x-enum-varnames:
    - ActorOperator
    - ActorProject
  audit.Target:
    properties:
      id:
        type: string
      kind:
        type: string
      name:
        type: string
    type: object
  auditlog.ActorResponse:
    properties:
      credential_id:
        example: key_9b2f4c1a-1111-4222-8333-444455556666
        type: string
      email:
        example: ada@example.com
        type: string
      project_id:
        example: prj_7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      subject:
        example: 9c1e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      type:
        enum:
        - operator
        - project
        example: operator
        type: string
    type: object
  auditlog.ErrorBody:
    properties:
      code:
        example: invalid_request
        type: string
      field:
        example: cursor
        type: string
      message:
        example: Request is invalid
        type: string
      request_id:
        example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
        type: string
    type: object
  auditlog.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/auditlog.ErrorBody'
    type: object
  auditlog.EventResponse:
    properties:
      actor:
        $ref: '#/definitions/auditlog.ActorResponse'
      event:
        example: project_credential.revoked
        type: string
      id:
        example: evt_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        type: string
      metadata:
        additionalProperties: {}
        description: Metadata is per-event detail, allowlisted per event type at write
          time.
        type: object
      occurred_at:
        example: "2026-08-10T14:03:11Z"
        type: string
      outcome:
        description: Outcome is "success" or "failure".
        enum:
        - success
        - failure
        example: success
        type: string
      reason_code:
        description: |-
          ReasonCode is present only on a failure, and is drawn from the closed /v1
          error vocabulary. It is never an upstream error message: the real cause
          is in the log line for this request_id.
        example: provider_unavailable
        type: string
      request_id:
        example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
        type: string
      resource:
        $ref: '#/definitions/auditlog.ResourceResponse'
    type: object
  auditlog.ListEventsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/auditlog.EventResponse'
        type: array
      pagination:
        $ref: '#/definitions/auditlog.PaginationInfo'
    type: object
  auditlog.PaginationInfo:
    properties:
      count:
        description: |-
          Count is the number of items IN THIS PAGE, never a total. A total would
          mean a second COUNT(*) over an append-heavy table on every request, to
          answer a question no client here needs.
        example: 50
        type: integer
      limit:
        description: Limit is the page size actually applied.
        example: 50
        type: integer
      next_cursor:
        description: |-
          NextCursor is absent on the last page.

          Its ABSENCE is the end-of-history signal, not an empty page: a client
          loops while this is present, so a correct client makes exactly as many
          requests as there are pages.
        example: MTc1NDg0MTM5MTAwMDAwMDAwMC4z...
        type: string
    type: object
  auditlog.ResourceResponse:
    properties:
      id:
        example: key_9b2f4c1a-1111-4222-8333-444455556666
        type: string
      type:
        example: project_credential
        type: string
    type: object
  connection.AccessMode:
    enum:
    - unknown
    - full
    - read_only
    - limited
    type: string
    x-enum-varnames:
    - AccessModeUnknown
    - AccessModeFull
    - AccessModeReadOnly
    - AccessModeLimited
  connection.Check:
    properties:
      detail:
        description: |-
          Detail is a short human-readable explanation, safe to show an operator.
          It never contains the client secret, the access token, or a provider
          response body — a provider's error page can echo back anything.
        example: authenticated as service account
        type: string
      name:
        description: Name is one of the Check* constants.
        example: client_authenticated
        type: string
      ok:
        description: OK is whether this specific probe passed.
        type: boolean
    type: object
  connection.ConnectionResponse:
    properties:
      access_mode:
        description: |-
          AccessMode is what the service account was proven able to do.
          `full` is claimed ONLY when write capability was positively proven —
          see connection.AccessMode. A client may enable mutation controls on
          `full` and must not on `read_only` or `limited`.
        enum:
        - unknown
        - full
        - read_only
        - limited
        example: full
        type: string
      activated_at:
        type: string
      base_url:
        example: https://kc.example.com
        type: string
      can_write:
        description: |-
          CanWrite is AccessMode's write verdict, precomputed so a client does not
          re-implement the rule (and get `unknown` wrong in either direction).
          It is the field a UI should gate mutation controls on.
        example: true
        type: boolean
      client_id:
        example: saas-backend-admin
        type: string
      created_at:
        type: string
      has_client_secret:
        description: |-
          HasClientSecret reports that a credential is stored. It is always true
          today because the column is NOT NULL; it exists as a field so that
          clients render "secret configured" from the API rather than assuming,
          and so the shape already fits if a secret-less auth method (mTLS,
          private_key_jwt) is ever added.
        example: true
        type: boolean
      health:
        enum:
        - unknown
        - healthy
        - unhealthy
        example: healthy
        type: string
      health_message:
        type: string
      id:
        example: conn_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        type: string
      last_verified_at:
        type: string
      name:
        example: Production Keycloak
        type: string
      provider:
        enum:
        - keycloak
        example: keycloak
        type: string
      realm:
        example: saas
        type: string
      retired_at:
        type: string
      status:
        enum:
        - draft
        - active
        - retired
        example: draft
        type: string
      updated_at:
        type: string
      verified:
        description: |-
          Verified is IsVerified evaluated at response time: healthy AND the probe
          is still inside its validity window. Computed rather than stored, because
          it is a fact about now, not about the row — a client that stored it would
          be wrong an hour later.
        example: true
        type: boolean
      workspace_id:
        example: ws_5a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        type: string
    type: object
  connection.CreateConnectionRequest:
    properties:
      base_url:
        example: https://kc.example.com
        type: string
      client_id:
        example: saas-backend-admin
        type: string
      client_secret:
        description: |-
          ClientSecret is write-only. It is sealed with AES-256-GCM before it
          reaches the database and is never returned by any endpoint.
        example: the-service-account-secret
        type: string
      name:
        example: Production Keycloak
        type: string
      provider:
        description: Provider is optional while only one exists; omitted means keycloak.
        example: keycloak
        type: string
      realm:
        example: saas
        type: string
    required:
    - base_url
    - client_id
    - client_secret
    - name
    - realm
    type: object
  connection.ErrorBody:
    properties:
      code:
        example: connection_not_verified
        type: string
      message:
        example: Connection must pass verification before it can be activated
        type: string
      request_id:
        example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
        type: string
    type: object
  connection.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/connection.ErrorBody'
    type: object
  connection.ListConnectionsResponse:
    properties:
      connections:
        items:
          $ref: '#/definitions/connection.ConnectionResponse'
        type: array
      count:
        example: 2
        type: integer
    type: object
  connection.UpdateConnectionRequest:
    properties:
      base_url:
        type: string
      client_id:
        type: string
      client_secret:
        type: string
      name:
        type: string
      provider:
        type: string
      realm:
        type: string
      status:
        type: string
    type: object
  connection.VerifyReport:
    properties:
      access_mode:
        allOf:
        - $ref: '#/definitions/connection.AccessMode'
        description: AccessMode is what the admin client turned out to be allowed
          to do.
        enum:
        - unknown
        - full
        - read_only
        - limited
        example: full
      checked_at:
        description: CheckedAt is when the run completed.
        type: string
      checks:
        description: |-
          Checks are in execution order, and stop at the first failure that makes
          later ones meaningless (no point listing users if the token failed).
        items:
          $ref: '#/definitions/connection.Check'
        type: array
      ok:
        description: OK is the verdict that drives Health. See Verifier for what it
          requires.
        type: boolean
      summary:
        description: |-
          Summary is a one-line verdict for logs and for the connection's
          health_message.
        example: provider reachable, realm found, client authenticated, full admin
          access
        type: string
    type: object
  connection.VerifyResponse:
    properties:
      connection:
        $ref: '#/definitions/connection.ConnectionResponse'
      report:
        $ref: '#/definitions/connection.VerifyReport'
    type: object
  identity.AssignRolesRequestBody:
    properties:
      roles:
        example:
        - editor
        items:
          type: string
        type: array
    type: object
  identity.CreateInvitationRequestBody:
    properties:
      email:
        example: user@example.com
        type: string
      expires_at:
        example: "2026-12-31T23:59:59Z"
        type: string
      first_name:
        example: Jane
        type: string
      invited_by:
        example: adminuser
        type: string
      last_name:
        example: Doe
        type: string
      roles:
        example:
        - user
        items:
          type: string
        type: array
    type: object
  identity.CreateRoleRequestBody:
    properties:
      description:
        example: Support team role
        type: string
      name:
        example: support
        type: string
    type: object
  identity.InvitationResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      invited_by:
        type: string
      required_actions:
        items:
          type: string
        type: array
      status:
        type: string
      username:
        type: string
    type: object
  identity.ListInvitationsResponse:
    properties:
      count:
        type: integer
      invitations:
        items:
          $ref: '#/definitions/identity.InvitationResponse'
        type: array
    type: object
  identity.ListRolesResponse:
    properties:
      count:
        type: integer
      roles:
        items:
          $ref: '#/definitions/identity.RoleResponse'
        type: array
    type: object
  identity.ListSessionsResponse:
    properties:
      count:
        type: integer
      sessions:
        items:
          $ref: '#/definitions/identity.SessionResponse'
        type: array
    type: object
  identity.ListUsersResponse:
    properties:
      count:
        description: length of users array, NOT total
        type: integer
      first:
        type: integer
      max:
        type: integer
      users:
        items:
          $ref: '#/definitions/identity.UserResponse'
        type: array
    type: object
  identity.RoleResponse:
    properties:
      builtin:
        type: boolean
      composite:
        type: boolean
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  identity.SessionResponse:
    properties:
      clients:
        additionalProperties:
          type: string
        type: object
      id:
        type: string
      ip_address:
        type: string
      last_access:
        type: string
      started_at:
        type: string
      user_agent:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  identity.UpdateRoleRequestBody:
    properties:
      description:
        example: Updated support team description
        type: string
    type: object
  identity.UpdateUserRequestBody:
    properties:
      email:
        example: jane@example.com
        type: string
      email_verified:
        example: true
        type: boolean
      enabled:
        example: true
        type: boolean
      first_name:
        example: Jane
        type: string
      last_name:
        example: Doe
        type: string
    type: object
  identity.UserResponse:
    properties:
      attributes:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      enabled:
        type: boolean
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      username:
        type: string
    type: object
  identityruntime.AssignRolesRequest:
    properties:
      roles:
        example:
        - support
        items:
          type: string
        type: array
    required:
    - roles
    type: object
  identityruntime.CreateInvitationRequest:
    properties:
      email:
        example: ada@example.com
        type: string
      expires_at:
        description: ExpiresAt is optional, RFC 3339, and must be in the future.
        example: "2026-12-31T23:59:59Z"
        type: string
      first_name:
        example: Ada
        type: string
      invited_by:
        description: InvitedBy defaults to the authenticated caller when omitted.
        example: admin@example.com
        type: string
      last_name:
        example: Lovelace
        type: string
      roles:
        description: |-
          Roles is REQUIRED and must contain at least one existing realm role name.
          Unlike CreateUserRequest, where roles can be granted afterwards, an
          invitation with no roles would invite someone to an account that can do
          nothing.
        example:
        - support
        items:
          type: string
        type: array
    required:
    - email
    - roles
    type: object
  identityruntime.CreateRoleRequest:
    properties:
      description:
        example: Can view and refund invoices
        type: string
      name:
        example: billing-admin
        type: string
    required:
    - name
    type: object
  identityruntime.CreateUserRequest:
    properties:
      email:
        example: ada@example.com
        type: string
      first_name:
        example: Ada
        type: string
      last_name:
        example: Lovelace
        type: string
      roles:
        description: 'Roles is optional: realm role names to grant at creation.'
        example:
        - support
        items:
          type: string
        type: array
      temporary_password:
        description: |-
          TemporaryPassword is REQUIRED and must be at least 8 characters. There is
          no way to create a user without choosing a credential for them; the
          alternative is an invitation, which needs working SMTP on the realm.

          It is never echoed back, never logged, and never part of an audit event.
        example: ch4nge-me-now
        type: string
    required:
    - email
    - temporary_password
    type: object
  identityruntime.ErrorBody:
    properties:
      code:
        example: workspace_connection_missing
        type: string
      field:
        description: |-
          Field names the request field a validation failure is about.

          `omitempty`, and that is the compatibility contract: an error that is not
          about a field carries no key at all, so a client written before this
          existed decodes every response exactly as it did. Adding a key is safe;
          adding one that is sometimes an empty string is not, because it invites
          `if err.Field == ""` to be read as "no field" in one place and "field is
          blank" in another.

          Set only for `invalid_request`. Never derived from client input.
        example: temporary_password
        type: string
      message:
        example: Workspace has no active connection
        type: string
      request_id:
        example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
        type: string
    type: object
  identityruntime.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/identityruntime.ErrorBody'
    type: object
  identityruntime.SetPasswordRequest:
    properties:
      password:
        example: ch4nge-me-now
        type: string
      temporary:
        description: |-
          Temporary forces a change on next login. Defaults to false, so an
          omitted field sets a permanent password — the caller must opt in to
          the friction rather than out of it.
        example: true
        type: boolean
    required:
    - password
    type: object
  identityruntime.UpdateRoleRequest:
    properties:
      description:
        type: string
    type: object
  identityruntime.UpdateUserRequest:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      enabled:
        type: boolean
      first_name:
        type: string
      last_name:
        type: string
    type: object
  project.CreateCredentialRequest:
    properties:
      expires_at:
        description: ExpiresAt is optional. When set it must be in the future.
        type: string
      label:
        description: Label is required. An unlabelled key is one nobody dares revoke.
        example: billing worker (staging)
        type: string
      scopes:
        description: |-
          Scopes must be non-empty and drawn from the supported vocabulary. There
          is no default and nothing is implied: a credential's power is always an
          explicit choice.
        example:
        - users:read
        items:
          type: string
        type: array
    required:
    - label
    - scopes
    type: object
  project.CreateCredentialResponse:
    properties:
      credential:
        $ref: '#/definitions/project.CredentialResponse'
      secret:
        description: Secret is the full token, e.g. lw_sk_<lookup>_<secret>. Shown
          once.
        example: lw_sk_REDACTED_REDACTED
        type: string
    type: object
  project.CreateProjectRequest:
    properties:
      name:
        example: Billing worker
        type: string
    required:
    - name
    type: object
  project.CredentialResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      expires_at:
        type: string
      id:
        example: key_7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      key_prefix:
        description: |-
          KeyPrefix is the lookup segment of the token, e.g. "k3mzr7q2xwab5f9d".
          Shown so an operator can match a key in a log line to a row here.
        example: k3mzr7q2xwab5f9d
        type: string
      label:
        example: billing worker (staging)
        type: string
      last_used_at:
        type: string
      project_id:
        example: prj_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        type: string
      revoked_at:
        type: string
      revoked_by:
        type: string
      scopes:
        example:
        - users:read
        - users:write
        items:
          type: string
        type: array
      status:
        description: |-
          Status is the credential's effective state, computed at response time:
          active, expired or revoked. Computed rather than stored because expiry is
          a fact about now, not about the row.
        enum:
        - active
        - expired
        - revoked
        example: active
        type: string
    type: object
  project.ErrorBody:
    properties:
      code:
        example: project_not_found
        type: string
      message:
        example: Project not found
        type: string
      request_id:
        example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
        type: string
    type: object
  project.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/project.ErrorBody'
    type: object
  project.ListCredentialsResponse:
    properties:
      count:
        example: 2
        type: integer
      credentials:
        items:
          $ref: '#/definitions/project.CredentialResponse'
        type: array
    type: object
  project.ListProjectsResponse:
    properties:
      count:
        example: 2
        type: integer
      projects:
        items:
          $ref: '#/definitions/project.ProjectResponse'
        type: array
    type: object
  project.ProjectResponse:
    properties:
      active_credentials:
        description: |-
          ActiveCredentials is how many credentials can currently authenticate.
          Included in the listing so an operator can see at a glance which projects
          hold live keys without opening each one.
        example: 2
        type: integer
      archived_at:
        type: string
      created_at:
        type: string
      id:
        example: prj_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        type: string
      name:
        example: Billing worker
        type: string
      status:
        enum:
        - active
        - archived
        example: active
        type: string
      updated_at:
        type: string
      workspace_id:
        example: ws_5a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        type: string
    type: object
  project.ScopesResponse:
    properties:
      scopes:
        items:
          type: string
        type: array
    type: object
  project.UpdateProjectRequest:
    properties:
      name:
        example: Billing worker EU
        type: string
      status:
        type: string
      workspace_id:
        type: string
    type: object
  server.auditEventDTO:
    properties:
      action:
        type: string
      actor:
        $ref: '#/definitions/audit.Actor'
      extra:
        additionalProperties: {}
        type: object
      ip:
        type: string
      reason:
        type: string
      target:
        $ref: '#/definitions/audit.Target'
      ts:
        type: string
    type: object
  server.listEventsResponse:
    properties:
      capacity:
        type: integer
      count:
        type: integer
      dropped:
        type: integer
      events:
        items:
          $ref: '#/definitions/server.auditEventDTO'
        type: array
    type: object
  server.readinessReport:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        example: ready
        type: string
    type: object
  user.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      keycloak_sub:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  workspace.CreateWorkspaceRequest:
    properties:
      name:
        description: Name is required and must be non-blank after trimming.
        example: Production
        type: string
      slug:
        description: |-
          Slug is optional. When omitted it is derived from Name; when present it
          is only trimmed and lowercased, never slugified — an unusable slug is
          reported rather than silently rewritten.
        example: production
        type: string
    required:
    - name
    type: object
  workspace.ErrorBody:
    properties:
      code:
        example: workspace_not_found
        type: string
      message:
        example: Workspace not found
        type: string
      request_id:
        example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
        type: string
    type: object
  workspace.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/workspace.ErrorBody'
    type: object
  workspace.ListWorkspacesResponse:
    properties:
      count:
        example: 2
        type: integer
      workspaces:
        items:
          $ref: '#/definitions/workspace.WorkspaceResponse'
        type: array
    type: object
  workspace.UpdateWorkspaceRequest:
    properties:
      name:
        example: Production EU
        type: string
      slug:
        type: string
      status:
        type: string
    type: object
  workspace.WorkspaceResponse:
    properties:
      archived_at:
        description: |-
          ArchivedAt is null for active workspaces and set for archived ones. The
          database enforces that this and Status can never disagree.
        type: string
      created_at:
        type: string
      id:
        description: |-
          ID is always the prefixed form, `ws_<uuid>`. The bare UUID is never
          exposed.
        example: ws_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        type: string
      name:
        example: Production
        type: string
      slug:
        example: production
        type: string
      status:
        enum:
        - active
        - archived
        example: active
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    SaaS backend with Keycloak-issued JWT auth.
    All protected endpoints require a Bearer token obtained from Keycloak.
  title: Lightweight SaaS Backend API
  version: 0.4.0
paths:
  /admin/audit-events:
    get:
      description: |-
        Returns a newest-first snapshot of the in-process audit
        ring buffer. Process-local and volatile: events from other
        replicas are not visible, and a restart drops the buffer.
        The durable trail is the structured log stream.
      parameters:
      - description: 'max events to return (default: capacity; clamped to capacity)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.listEventsResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List recent audit events (admin)
      tags:
      - audit
  /admin/invitations:
    get:
      description: |-
        Synthesizes an "invitations" view from Keycloak users whose
        state implies an invitation: required actions pending, or
        users carrying the `invited_by` user attribute (written by
        POST /admin/users/invite when that lands in Stage B).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.ListInvitationsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List pending invitations (admin)
      tags:
      - invitations
    post:
      consumes:
      - application/json
      description: |-
        Provisions a Keycloak user in invited-but-incomplete state,
        assigns initial realm roles, and dispatches the action email
        (VERIFY_EMAIL + UPDATE_PASSWORD). The new user is enabled but
        cannot fully sign in until they complete both actions.
        When the request body omits `invited_by`, the handler
        defaults it to the authenticated admin's email (or sub).
      parameters:
      - description: invitation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/identity.CreateInvitationRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/identity.InvitationResponse'
        "400":
          description: invalid email, empty roles, past expires_at, etc.
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: one of the requested roles does not exist
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: a user with this email already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: 'upstream identity provider unavailable (often: SMTP not configured)'
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: identity management not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create invitation (admin)
      tags:
      - invitations
  /admin/invitations/{id}:
    delete:
      description: |-
        Deletes the underlying Keycloak user. Guarded against
        self-delete.
      parameters:
      - description: Invitation id (= Keycloak user UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke an invitation (admin)
      tags:
      - invitations
  /admin/invitations/{id}/resend:
    post:
      description: |-
        Idempotent — re-dispatches the VERIFY_EMAIL + UPDATE_PASSWORD
        action email. Returns the invitation as it stands now.
      parameters:
      - description: Invitation id (= Keycloak user UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.InvitationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Re-send an invitation email (admin)
      tags:
      - invitations
  /admin/roles:
    get:
      description: |-
        Returns every realm role in the Keycloak realm. Client roles
        are filtered out. Built-in roles (offline_access,
        uma_authorization, default-roles-*) are flagged via the
        `builtin` field so callers can disable destructive actions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.ListRolesResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List realm roles (admin)
      tags:
      - roles
    post:
      consumes:
      - application/json
      description: |-
        Creates a new realm role in Keycloak. The service normalizes
        the name (lowercase + trim) and rejects reserved names
        (admin, user, offline_access, uma_authorization, default-roles-*).
        Duplicates surface as 409.
      parameters:
      - description: role definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/identity.CreateRoleRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/identity.RoleResponse'
        "400":
          description: invalid name (empty, too long, reserved, or bad characters)
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: role already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: upstream identity provider unavailable
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: identity management not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create realm role (admin)
      tags:
      - roles
  /admin/roles/{name}:
    delete:
      description: |-
        Protected roles (admin, user, default-roles-*,
        offline_access, uma_authorization) are rejected with 403.
      parameters:
      - description: realm role name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: protected role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a realm role (admin)
      tags:
      - roles
    get:
      parameters:
      - description: realm role name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.RoleResponse'
        "400":
          description: malformed name
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get realm role by name (admin)
      tags:
      - roles
    patch:
      consumes:
      - application/json
      description: |-
        Only the description field is mutable. Protected roles
        (admin, user, default-roles-*, offline_access, uma_authorization)
        are rejected with 403.
      parameters:
      - description: realm role name
        in: path
        name: name
        required: true
        type: string
      - description: fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/identity.UpdateRoleRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.RoleResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: protected role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a role's description (admin)
      tags:
      - roles
  /admin/roles/{name}/users:
    get:
      parameters:
      - description: realm role name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.ListUsersResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such role
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List users carrying a role (admin)
      tags:
      - roles
  /admin/sessions:
    get:
      description: |-
        Aggregates user-sessions across every enabled client in the
        realm. A session that has touched multiple clients yields a
        single entry whose `clients` map carries every client name.
        One slow or failing client does not break the aggregation;
        failures are silently skipped.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.ListSessionsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List active sessions across the realm (admin)
      tags:
      - sessions
  /admin/sessions/{id}:
    delete:
      parameters:
      - description: session UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke a single session (admin)
      tags:
      - sessions
  /admin/users:
    get:
      description: |-
        Returns a page of users from the Keycloak realm. Requires the
        caller's token to carry the realm `admin` role. Pagination
        is offset-based; `max` is clamped to [1, 100] server-side.
      parameters:
      - description: substring match on username/email/firstName/lastName
        in: query
        name: search
        type: string
      - description: offset (default 0)
        in: query
        name: first
        type: integer
      - description: page size (default 20, max 100)
        in: query
        name: max
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.ListUsersResponse'
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: upstream identity provider unavailable
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: identity management not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List users (admin)
      tags:
      - users
  /admin/users/{id}:
    delete:
      description: |-
        Guarded: refuses to delete your own account; refuses to
        delete the last enabled admin.
      parameters:
      - description: Keycloak sub UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: self-delete / last-admin guard
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a user (admin)
      tags:
      - users
    get:
      description: |-
        Returns a single user by Keycloak `sub` UUID. Requires the
        caller's token to carry the realm `admin` role.
      parameters:
      - description: Keycloak sub UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.UserResponse'
        "400":
          description: malformed id (not a UUID)
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: missing/invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: token lacks admin role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no user with that id
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: upstream identity provider unavailable
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: identity management not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user by id (admin)
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        Partial update — omitted fields are preserved. Guarded
        against self-disable and last-admin removal. Returns the
        updated user representation.
      parameters:
      - description: Keycloak sub UUID
        in: path
        name: id
        required: true
        type: string
      - description: fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/identity.UpdateUserRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.UserResponse'
        "400":
          description: malformed id or body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: self-disable / last-admin guard
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a user (admin)
      tags:
      - users
  /admin/users/{id}/password:
    put:
      consumes:
      - application/json
      description: |-
        Sets the user's Keycloak credential directly. When temporary=true
        the user must change the password on next login.
      parameters:
      - description: Keycloak sub UUID
        in: path
        name: id
        required: true
        type: string
      - description: password payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set user password (admin)
      tags:
      - users
  /admin/users/{id}/reset-password:
    post:
      description: |-
        Queues UPDATE_PASSWORD as a required action and dispatches
        the action email via Keycloak's execute-actions-email
        endpoint. Requires realm SMTP to be configured (a 502
        usually means it isn't).
      parameters:
      - description: Keycloak sub UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: SMTP not configured / upstream failure
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Send a password-reset email (admin)
      tags:
      - users
  /admin/users/{id}/roles:
    get:
      parameters:
      - description: Keycloak sub UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.ListRolesResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List a user's realm roles (admin)
      tags:
      - users
    post:
      consumes:
      - application/json
      description: |-
        Grants the named realm roles. Roles are resolved by name —
        a missing role short-circuits with 404 before any
        partial-assignment happens.
      parameters:
      - description: Keycloak sub UUID
        in: path
        name: id
        required: true
        type: string
      - description: role names to grant
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/identity.AssignRolesRequestBody'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: user or role not found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Assign realm roles to a user (admin)
      tags:
      - users
  /admin/users/{id}/roles/{name}:

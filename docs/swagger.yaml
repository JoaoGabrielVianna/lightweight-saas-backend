  /v1/workspaces/{workspace_id}/projects/{project_id}/archive:
    post:
      description: |-
        Freezes the project. EVERY credential it holds stops
        authenticating immediately — authentication reads the project's
        status in the same lookup as the credential, so this is one
        atomic kill switch rather than a loop over keys that could
        half-finish.

        Idempotent: archiving an already-archived project succeeds.

        **Operator only.**
      parameters:
      - description: workspace id
        example: ws_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: workspace_id
        required: true
        type: string
      - description: project id
        example: prj_7c9e6679-7425-40de-944b-e07fc1f90ae7
        in: path
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.ProjectResponse'
        "400":
          description: invalid_workspace_id, invalid_project_id
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "401":
          description: credential_invalid
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "403":
          description: forbidden, operator_only
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "404":
          description: workspace_not_found, project_not_found

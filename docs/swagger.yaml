            $ref: '#/definitions/project.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/project.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Archive a project
      tags:
      - projects
  /v1/workspaces/{workspace_id}/projects/{project_id}/credentials:
    get:
      description: |-
        Returns credential METADATA. The secret is never included, and
        no endpoint can return it: only a SHA-256 digest is stored, so
        the plaintext does not exist anywhere in this system after the
        create call returned it.

        Revoked credentials are included: the list is the trail an
        operator reads when working out which key a deployment still
        holds.

        **Operator only.**
      parameters:
      - description: workspace id
        example: ws_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: workspace_id
        required: true
        type: string
      - description: project id
        example: prj_7c9e6679-7425-40de-944b-e07fc1f90ae7
        in: path
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.ListCredentialsResponse'
        "400":
          description: invalid_workspace_id, invalid_project_id
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "401":
          description: credential_invalid
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "403":
          description: forbidden, operator_only
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "404":
          description: workspace_not_found, project_not_found
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/project.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List a project's credentials
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: |-
        Mints a machine credential and returns the secret **once**.
        There is no endpoint that can show it again, and adding one
        would be impossible without changing what is stored: only a
        SHA-256 digest of the secret is persisted.

        Scopes are explicit and non-empty. Nothing is granted by
        default, and an empty list is rejected rather than treated as
        "no permissions" — a credential that authenticates and can do
        nothing is a configuration mistake worth reporting at creation.

        A project may hold at most 10 active credentials. Rotation is
        create-new, deploy, revoke-old.

        **Operator only.**
      parameters:
      - description: workspace id
        example: ws_3f2504e0-4f89-41d3-9a0c-0305e82c3301
        in: path
        name: workspace_id
        required: true
        type: string
      - description: project id
        example: prj_7c9e6679-7425-40de-944b-e07fc1f90ae7
        in: path
        name: project_id
        required: true
        type: string
      - description: credential to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/project.CreateCredentialRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/project.CreateCredentialResponse'
        "400":
          description: credential_label_required, invalid_scope, invalid_request
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "401":
          description: credential_invalid
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "403":
          description: forbidden, operator_only
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "404":
          description: workspace_not_found, project_not_found
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "409":
          description: project_archived, credential_limit_reached
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "500":
          description: internal_error

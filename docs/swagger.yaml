  /health:
    get:
      description: Equivalent to /health/live. Kept for existing deployments and monitors.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe (legacy path)
      tags:
      - operations
  /health/live:
    get:
      description: |-
        Returns 200 while the process is running. No auth, no dependency checks, no I/O.
        A failure here means the process is wedged and should be restarted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - operations
  /health/ready:
    get:
      description: |-
        Returns 200 when this instance can serve traffic, 503 otherwise.
        Checks only GLOBAL dependencies: the database, and whether a shutdown has begun.
        A workspace whose Keycloak is down does NOT make the instance unready —
        that request answers provider_unavailable and every other workspace keeps working.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.readinessReport'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/server.readinessReport'
      summary: Readiness probe
      tags:
      - operations
  /me:

# golangci-lint configuration — see docs/QUALITY_GATE.md §Build
#
# STRATEGY: RATCHET, NOT BIG-BANG.
#
# Linting never ran in this repository before 2026-07-26 (the CI workflow
# never installed the binary, so `make lint` silently no-opped — recorded as
# TD-011). Turning every linter on at once would have produced 34 findings and
# a red gate that contributors learn to ignore.
#
# So the enabled set below is exactly the set that is GREEN against the
# current tree. It is BLOCKING in CI from day one. Linters with outstanding
# findings are listed under `# DEFERRED` with their current count and are
# promoted one at a time, each in its own PR that fixes the findings and moves
# the line up. A gate that is green and enforced beats a gate that is
# comprehensive and bypassed.
#
# To promote a deferred linter:
#   1. golangci-lint run --default=none -E <linter> ./...
#   2. Fix every finding (or add a //nolint with a reason — never a bare one).
#   3. Move it into `enable:` below, run `make lint`, commit both together.

version: "2"

run:
  timeout: 5m
  # Tests are linted too. They are the majority of this repo's code and the
  # place regressions hide.
  tests: true

linters:
  default: none

  enable:
    # ── Correctness ───────────────────────────────────────────────────────
    - govet          # stdlib vet suite: printf, copylocks, loopclosure, ...
    - ineffassign    # assignments never read
    - unused         # unreferenced identifiers (caught dead newProviderWithKeyfunc)
    - nilerr         # returns nil where err is non-nil — the classic silent swallow
    - bodyclose      # unclosed HTTP response bodies (leaks; this repo is HTTP-heavy)
    - rowserrcheck   # unchecked sql.Rows.Err
    - durationcheck  # nonsensical time.Duration arithmetic
    - copyloopvar    # redundant loop-variable copies (Go 1.22+)

    # ── Hygiene ───────────────────────────────────────────────────────────
    - misspell       # English spelling in comments and strings

    # ── DEFERRED — do not enable without fixing the findings first ────────
    # - errcheck     # 20 findings: bootstrap/prompt.go 6, smtp_handler.go 3,
    #                #   identity/keycloak/admin.go 3, tests 8.
    #                #   Target: v0.4. Highest value of the deferred set —
    #                #   unchecked errors are how failures go silent.
    # - staticcheck  # 13 findings: 8× S1016 (convertible struct literals in
    #                #   identity/dto.go + handler.go), 3× QF1012, 1× SA9009
    #                #   (ineffectual "// go:embed" directive in landing.go).
    #                #   Target: v0.4.

  settings:
    govet:
      enable-all: true
      disable:
        # fieldalignment optimizes struct memory layout at the cost of
        # grouping related fields together. This codebase deliberately orders
        # struct fields for readability (see config.Config, identity.User) and
        # none of them are allocated in hot loops.
        - fieldalignment
        # shadow flags idiomatic `if err := f(); err != nil` chains that are
        # used consistently throughout the repo.
        - shadow

    misspell:
      # No `locale:` on purpose. This codebase writes British English in
      # comments ("behaviour", "centralising") consistently. Pinning a locale
      # would rewrite prose across dozens of files for zero correctness gain.
      # Unset, misspell flags only genuine typos, which is what we want.
      ignore-rules:
        - behaviour
        - behaviours
        - centralising
        - centralised
        - normalisation
        - initialise
        - initialised

  exclusions:
    generated: lax
    rules:
      # Generated Swagger artifacts — regenerated by `make docs`, never
      # hand-edited, so linting them produces noise nobody can act on.
      - path: ^docs/docs\.go$
        linters: [govet, unused, misspell, ineffassign]

formatters:
  enable:
    - gofmt
